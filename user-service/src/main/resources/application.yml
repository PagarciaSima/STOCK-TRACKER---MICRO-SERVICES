spring:
  datasource:
    url: jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true
    username: root
    password: admin
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8081

jwt:
  secret: qNiwobQFrXWDou6EIWAhman5n771RqZlCltkMgbYptc=
  # 1 hour
  expiration: "1 * 60 * 60 * 1000"
  # 24 hour
  refresh-expiration: "24 * 60 * 60 * 1000"

management:
  endpoints:
    web:
      exposure:
        include: health,info