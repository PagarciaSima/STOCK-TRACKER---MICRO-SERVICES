spring:
  # Loads the repository-level .env file (KEY=value) as a properties source.
  # `optional:` keeps startup working when the file is absent (CI, production images).
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${USER_DB_URL:jdbc:mysql://localhost:3306/user_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${USER_SERVICE_PORT:8081}

jwt:
  # No default on purpose: the service must fail fast when the secret is missing.
  # Must be Base64 and decode to at least 32 bytes (HS256 minimum); see .env.
  secret: ${JWT_SECRET}
  # Milliseconds, because the injected fields are `long`: the previous value
  # "1 * 60 * 60 * 1000" was a String and broke the startup with NumberFormatException.
  # 1 hour
  expiration: ${JWT_EXPIRATION:3600000}
  # 24 hours
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  show-actuator: false
