spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:

        # PUBLIC ROUTES (no JWT)
        - id: user-service-public
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/register, /api/v1/users/login

        # USER-SERVICE
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthFilter

        # MARKET-DATA-SERVICE
        - id: market-data-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/market/**
          filters:
            - name: JwtAuthFilter

        # WEBSOCKET
        - id: market-websocket
          uri: ws://localhost:8082
          predicates:
            - Path=/ws/**

        # ORDER-SERVICE
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: JwtAuthFilter

        # PORTFOLIO-SERVICE
        - id: portfolio-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/portfolio/**
          filters:
            - name: JwtAuthFilter

        # NOTIFICATION-SERVICE
        - id: notification-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: JwtAuthFilter

        # OPENAPI AGGREGATION (public)
        - id: openapi-users
          uri: http://localhost:8081
          predicates:
            - Path=/v3/api-docs/users
          filters:
            - RewritePath=/v3/api-docs/users, /v3/api-docs

        - id: openapi-market-data
          uri: http://localhost:8082
          predicates:
            - Path=/v3/api-docs/market-data
          filters:
            - RewritePath=/v3/api-docs/market-data, /v3/api-docs

        - id: openapi-orders
          uri: http://localhost:8083
          predicates:
            - Path=/v3/api-docs/orders
          filters:
            - RewritePath=/v3/api-docs/orders, /v3/api-docs

        - id: openapi-portfolio
          uri: http://localhost:8084
          predicates:
            - Path=/v3/api-docs/portfolio
          filters:
            - RewritePath=/v3/api-docs/portfolio, /v3/api-docs

        - id: openapi-notifications
          uri: http://localhost:8085
          predicates:
            - Path=/v3/api-docs/notifications
          filters:
            - RewritePath=/v3/api-docs/notifications, /v3/api-docs

server:
  port: 8080

jwt:
  secret: qNiwobQFrXWDou6EIWAhman5n771RqZlCltkMgbYptc=

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: Users
        url: /v3/api-docs/users
      - name: Market Data
        url: /v3/api-docs/market-data
      - name: Orders
        url: /v3/api-docs/orders
      - name: Portfolio
        url: /v3/api-docs/portfolio
      - name: Notifications
        url: /v3/api-docs/notifications

management:
  endpoints:
    web:
      exposure:
        include: health,info
