spring:
  # Loads the repository-level .env file (KEY=value) as a properties source.
  # `optional:` keeps startup working when the file is absent (CI, production images).
  config:
    import: optional:file:../.env[.properties]
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:

        # PUBLIC ROUTES (no JWT)
        - id: user-service-public
          uri: "${USER_SERVICE_URI:http://localhost:8081}"
          predicates:
            - Path=/api/v1/users/register, /api/v1/users/login

        # USER-SERVICE
        - id: user-service
          uri: "${USER_SERVICE_URI:http://localhost:8081}"
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtAuthFilter

        # MARKET-DATA-SERVICE
        - id: market-data-service
          uri: "${MARKET_SERVICE_URI:http://localhost:8082}"
          predicates:
            - Path=/api/v1/market/**
          filters:
            - name: JwtAuthFilter

        # WEBSOCKET
        - id: market-websocket
          uri: "${MARKET_SERVICE_WS_URI:ws://localhost:8082}"
          predicates:
            - Path=/ws/**

        # ORDER-SERVICE
        - id: order-service
          uri: "${ORDER_SERVICE_URI:http://localhost:8083}"
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - name: JwtAuthFilter

        # PORTFOLIO-SERVICE
        - id: portfolio-service
          uri: "${PORTFOLIO_SERVICE_URI:http://localhost:8084}"
          predicates:
            - Path=/api/v1/portfolio/**
          filters:
            - name: JwtAuthFilter

        # NOTIFICATION-SERVICE
        - id: notification-service
          uri: "${NOTIFICATION_SERVICE_URI:http://localhost:8085}"
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: JwtAuthFilter

        # OPENAPI AGGREGATION (public)
        - id: openapi-users
          uri: "${USER_SERVICE_URI:http://localhost:8081}"
          predicates:
            - Path=/v3/api-docs/users
          filters:
            - RewritePath=/v3/api-docs/users, /v3/api-docs

        - id: openapi-market-data
          uri: "${MARKET_SERVICE_URI:http://localhost:8082}"
          predicates:
            - Path=/v3/api-docs/market-data
          filters:
            - RewritePath=/v3/api-docs/market-data, /v3/api-docs

        - id: openapi-orders
          uri: "${ORDER_SERVICE_URI:http://localhost:8083}"
          predicates:
            - Path=/v3/api-docs/orders
          filters:
            - RewritePath=/v3/api-docs/orders, /v3/api-docs

        - id: openapi-portfolio
          uri: "${PORTFOLIO_SERVICE_URI:http://localhost:8084}"
          predicates:
            - Path=/v3/api-docs/portfolio
          filters:
            - RewritePath=/v3/api-docs/portfolio, /v3/api-docs

        - id: openapi-notifications
          uri: "${NOTIFICATION_SERVICE_URI:http://localhost:8085}"
          predicates:
            - Path=/v3/api-docs/notifications
          filters:
            - RewritePath=/v3/api-docs/notifications, /v3/api-docs

server:
  port: ${API_GATEWAY_PORT:8080}

jwt:
  # No default on purpose: the gateway must fail fast when the secret is missing.
  # Must be the SAME value the user-service signs with, otherwise every token is rejected.
  # Must be Base64 and decode to at least 32 bytes (HS256 minimum); see .env.
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: Users
        url: /v3/api-docs/users
      - name: Market Data
        url: /v3/api-docs/market-data
      - name: Orders
        url: /v3/api-docs/orders
      - name: Portfolio
        url: /v3/api-docs/portfolio
      - name: Notifications
        url: /v3/api-docs/notifications

management:
  endpoints:
    web:
      exposure:
        include: health,info
